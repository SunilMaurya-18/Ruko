voice.action=Before you send any money, look it up on SEBI Check. If you have already paid, call 1 9 3 0 at once.
voice.generic=Ruko could not explain this message right now. Before you send any money, look it up on SEBI Check or ask someone you trust.

how.title=How Ruko decides
how.intro=Ruko looks for a fixed list of warning signs. Each sign has a plain reason, listed below. Only these rules set the result; no AI model can change it.
how.bands=More serious signs raise the level of concern. Reassuring signs never lower it.
how.limit.1=Ruko gives no investment advice and never names shares.
how.limit.2=Ruko does not open links in the message or visit websites.
how.limit.3=Ruko does not check faces, voices, or videos.
how.limit.4=Ruko cannot confirm a registration number. Look it up on SEBI Check.
how.limit.5=No flags does not mean everything is fine. Always check before you pay.
how.limit.6=Your message is checked once and not kept. Personal numbers are hidden before the check.
how.snapshot.none=Ruko has no SEBI registration list right now. It shows the SEBI Check link instead.
how.snapshot.dated=Ruko carries a SEBI registration list dated {date}. A number missing from it is a flag; a number in it still needs SEBI Check.

# Recovery (Track B). Steps per path are listed in content/recovery.v0.json; links name entries in content/links.v0.json.
# Only the allowlisted official sites may appear here.
recovery.title=Get help
recovery.intro=Pick what happened. Each step can be done from this phone.
recovery.cyber_fraud.title=Money already sent
recovery.cyber_fraud.1=Call 1930 now. It is the national cyber crime helpline. The sooner you call, the better the chance of stopping the money.
recovery.cyber_fraud.2=Call your bank or UPI app customer care. Use the number on your card or in the official app. Give the date, amount, and transaction ID, and ask them to stop or dispute the payment.
recovery.cyber_fraud.3=File a complaint at cybercrime.gov.in. Add screenshots of the chat, the payment receipt, and the UPI ID or account you paid.
recovery.cyber_fraud.4=Do not pay more money to release or recover what you sent. Do not share an OTP or install an app because someone asks you to.
recovery.scores.title=Problem with a registered broker or DP
recovery.scores.1=First write to your broker or depository participant (DP) by email. Keep a copy of your complaint and of their reply.
recovery.scores.2=If it is not solved, file a complaint on SEBI SCORES at scores.sebi.gov.in. Keep your PAN, email, mobile number, and the broker or DP name ready.
recovery.scores.3=Note the complaint number SCORES gives you. You can follow the replies and the status there.
recovery.scores.4=SCORES is for brokers, DPs, and others registered with SEBI. If you paid a person or group that is not registered, follow the money already sent steps.
link.helpline_1930=Call 1930
link.cybercrime=Open cybercrime.gov.in
link.scores=Open SEBI SCORES
link.sebi_check=Open SEBI Check

