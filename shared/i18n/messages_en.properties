# Ruko catalogue text, English. UTF-8. Keys referenced from rules/signals.v0.json must exist in both languages.
# {date} is the only placeholder. No verdict words, no buy/sell/hold advice.

sig.C1.reason=Promises a fixed or guaranteed profit. No real investment can promise that.
sig.C1.spoken=This message promises sure profit. Real investments never promise a fixed profit.
sig.C2.reason=Asks you to pay a personal UPI ID or bank account for an investment or fee.
sig.C2.spoken=It asks you to send money to a personal account. Registered brokers collect money through an at-valid UPI handle.
sig.C3.reason=Asks you to install a screen-sharing app. Whoever is on the other side can see and use your phone.
sig.C3.spoken=It asks you to install a screen-sharing app. With it, a stranger can use your phone and your bank apps.
sig.C4.reason=Asks you to install a trading app from a file or a link outside the Play Store or App Store.
sig.C4.spoken=It asks you to install a trading app from outside the Play Store. Such apps can steal money and passwords.
sig.C15.reason=Claims to speak for SEBI, NSDL, an exchange, or a government office. They do not message people like this.
sig.C15.spoken=It claims to be from SEBI, NSDL, or an exchange. These offices do not call or message you like this.
sig.C16.reason=Asks for a fee, tax, or penalty before you get your profit, shares, or money back.
sig.C16.spoken=It asks you to pay a fee or tax first to release your money. Real payouts do not ask for money first.
sig.C17.reason=Asks you to scan a QR code to pay for an investment, fee, or membership.
sig.C17.spoken=It asks you to scan a QR code to pay. Scanning a code can send money out of your account.
sig.S5.reason=The registration number looks wrong, or does not match the role they claim.
sig.S5.spoken=The registration number looks wrong, or it does not fit the work they say they do.
sig.S6.reason=Says SEBI approved or guaranteed it. SEBI does not approve or guarantee tips, groups, or returns.
sig.S6.spoken=It says SEBI approved it. SEBI never approves tips or promises returns.
sig.S7.reason=Sells a paid VIP or premium tips group, or asks for a share of profits.
sig.S7.spoken=It sells a paid VIP tips group, or wants a share of your profit.
sig.S8.reason=Asks you to send money to them so that they can put it in your account.
sig.S8.spoken=It asks you to send money to them first, and says they will put it in your account.
sig.S9.reason=Names a share with a price target and a time. Such messages are used to push a price up and then sell.
sig.S9.spoken=It names a share, a price, and a time in advance. Such messages are used to push a price up and then sell.
sig.S10.reason=The website name looks like a known broker's name, or the site is very new.
sig.S10.spoken=The website name copies a known broker, or the site is very new.
sig.S19.reason=This registration number is not in the SEBI list dated {date} that Ruko carries.
sig.S19.spoken=This number is not in the SEBI list dated {date} that Ruko has.
sig.M11.reason=Pushes you to hurry: limited seats, today only, act now.
sig.M11.spoken=It pushes you to hurry. Take your time before you send any money.
sig.M12.reason=Shows profit screenshots or member stories as proof.
sig.M12.spoken=It shows profit screenshots or stories as proof. Screenshots are easy to fake.
sig.M13.reason=Uses a famous face, or a forwarded video or voice. Ruko did not check the face or the voice.
sig.M13.spoken=It uses a famous face or a forwarded video. Ruko did not check the face or the voice.
sig.U14.reason=Has a registration number. Ruko cannot confirm it. Look it up on SEBI Check.
sig.U14.spoken=It gives a registration number. Look it up on SEBI Check before you pay.
sig.R1.reason=The payee uses an @valid UPI handle, which SEBI-registered intermediaries use. Still look it up on SEBI Check.
sig.R1.spoken=The UPI handle has at-valid, which registered brokers use. Still look them up on SEBI Check.
sig.R2.reason=Reads like general investor education, with no payment ask and no promise of returns.
sig.R2.spoken=This reads like general investor education. It does not ask for money or promise profit.

analogy.guaranteed_return=A promise of fixed profit is like a fruit seller promising that every mango in the basket will be sweet. Nobody can know that. In the market, prices go up and down for everyone.
analogy.personal_upi=Paying a personal UPI for an investment is like paying a stranger at the bus stand for a train ticket. The money reaches him, not the railway.
analogy.remote_access=Installing a screen-sharing app is like giving a stranger the key to your house and going out. He can open every cupboard while you are away.
analogy.fee_to_unlock=Paying a fee to release your own profit is like being asked to pay before you can open your own locker. Real profit is simply paid out. Nobody asks for money first.
analogy.fno_leverage=Trading F&O with borrowed money is like carrying a heavy load across a weak bridge. A small shake can drop everything. Most small traders lose money here.
