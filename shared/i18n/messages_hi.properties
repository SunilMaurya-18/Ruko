analogy.guaranteed_return=पक्के मुनाफ़े का वादा ऐसा है जैसे फल वाला कहे कि टोकरी का हर आम मीठा निकलेगा। यह कोई नहीं जान सकता। बाज़ार में दाम सबके लिए ऊपर-नीचे होते हैं।
analogy.personal_upi=निवेश के लिए निजी UPI पर पैसा भेजना ऐसा है जैसे रेल टिकट के लिए बस अड्डे पर किसी अनजान को पैसे देना। पैसा उसके पास जाता है, रेलवे के पास नहीं।
analogy.remote_access=स्क्रीन दिखाने वाला ऐप डालना ऐसा है जैसे किसी अनजान को घर की चाबी देकर बाहर चले जाना। आपके पीछे वह हर अलमारी खोल सकता है।
analogy.fee_to_unlock=अपना मुनाफ़ा छुड़ाने के लिए फ़ीस देना ऐसा है जैसे अपनी ही तिजोरी खोलने के लिए पैसे माँगे जाएँ। असली मुनाफ़ा सीधे मिलता है, पहले पैसा नहीं माँगा जाता।
analogy.fno_leverage=उधार के पैसे से F&O करना ऐसा है जैसे कमज़ोर पुल पर भारी बोझ ले जाना। ज़रा सा हिलने पर सब गिर सकता है। ज़्यादातर छोटे ट्रेडर इसमें पैसा गँवाते हैं।
