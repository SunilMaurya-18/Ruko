how.limit.3=रुको चेहरा, आवाज़ या वीडियो नहीं जाँचता।
how.limit.4=रुको रजिस्ट्रेशन नंबर पक्का नहीं कर सकता। उसे SEBI Check पर देखें।
how.limit.5=निशान न मिलने का मतलब यह नहीं कि सब ठीक है। पैसा देने से पहले हमेशा जाँचें।
how.limit.6=आपका मैसेज एक बार जाँचा जाता है और रखा नहीं जाता। निजी नंबर जाँच से पहले छिपा दिए जाते हैं।
how.snapshot.none=रुको के पास अभी SEBI रजिस्ट्रेशन की कोई सूची नहीं है। इसलिए वह SEBI Check का लिंक दिखाता है।
how.snapshot.dated=रुको के पास {date} की SEBI रजिस्ट्रेशन सूची है। जो नंबर उसमें नहीं है, वह एक निशान है। जो नंबर उसमें है, उसे भी SEBI Check पर देखें।

