how.intro=रुको मैसेज में कुछ तय निशान ढूँढता है। हर निशान का एक साफ़ कारण है, जो नीचे लिखा है। नतीजा सिर्फ़ इन्हीं नियमों से तय होता है, कोई AI मॉडल इसे नहीं बदल सकता।
how.bands=ज़्यादा गंभीर निशान मिलने पर चिंता बढ़ती है। भरोसे की बातें चिंता को कभी कम नहीं करतीं।
