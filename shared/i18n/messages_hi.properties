recovery.title=मदद लें
recovery.intro=जो हुआ है, वह चुनें। हर कदम इसी फ़ोन से हो सकता है।
recovery.cyber_fraud.title=पैसे भेज चुके हैं
recovery.cyber_fraud.1=अभी 1930 पर कॉल करें। यह राष्ट्रीय साइबर क्राइम हेल्पलाइन है। जितनी जल्दी कॉल करेंगे, पैसा रुकवाने की उम्मीद उतनी ज़्यादा है।
recovery.cyber_fraud.2=अपने बैंक या UPI ऐप के कस्टमर केयर को कॉल करें। नंबर कार्ड पर या असली ऐप में देखें। तारीख, रकम और ट्रांजैक्शन आईडी बताएँ, और पेमेंट रोकने या उस पर शिकायत दर्ज करने को कहें।
recovery.cyber_fraud.3=cybercrime.gov.in पर शिकायत दर्ज करें। चैट के स्क्रीनशॉट, पेमेंट की रसीद, और जिस UPI आईडी या खाते में पैसे भेजे, वह जोड़ें।
recovery.cyber_fraud.4=भेजा हुआ पैसा छुड़ाने या वापस दिलाने के नाम पर और पैसे न भेजें। किसी के कहने पर OTP न बताएँ और कोई ऐप इंस्टॉल न करें।
recovery.scores.title=रजिस्टर्ड ब्रोकर या DP से परेशानी
recovery.scores.1=पहले अपने ब्रोकर या डिपॉज़िटरी पार्टिसिपेंट (DP) को ईमेल पर लिखकर शिकायत करें। अपनी शिकायत और उनके जवाब की कॉपी रखें।
recovery.scores.2=हल न हो तो SEBI SCORES पर शिकायत करें: scores.sebi.gov.in। अपना PAN, ईमेल, मोबाइल नंबर और ब्रोकर या DP का नाम तैयार रखें।
recovery.scores.3=SCORES से मिला शिकायत नंबर लिख लें। जवाब और शिकायत की स्थिति वहीं देख सकते हैं।
recovery.scores.4=SCORES सिर्फ SEBI में रजिस्टर्ड ब्रोकर, DP और दूसरी रजिस्टर्ड संस्थाओं के लिए है। अगर किसी बिना रजिस्ट्रेशन वाले व्यक्ति या ग्रुप को पैसे दिए हैं, तो पैसे भेज चुके हैं वाले कदम अपनाएँ।
