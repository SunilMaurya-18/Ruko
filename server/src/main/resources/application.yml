spring:
  application.name: ruko
  threads.virtual.enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    # A request field the API does not define is a 400, so no route can be handed free text it did not ask for.
    deserialization.fail-on-unknown-properties: true
  servlet.multipart:
    max-file-size: 2MB
    max-request-size: 2112KB
    # Above the largest allowed upload, so ASR audio stays in memory and never touches disk.
    file-size-threshold: 3MB
  mvc:
    log-request-details: false
    problemdetails.enabled: false
  # ShellConfig is the only static mapping (PWA shell with app-route fallback and cache headers).
  web.resources.add-mappings: false

server:
  port: ${PORT:8081}
  # Behind a host's proxy set FORWARD_HEADERS_STRATEGY=native, so the rate limit sees the client, not the proxy.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json,application/manifest+json,image/svg+xml
  mime-mappings:
    webmanifest: application/manifest+json
    wasm: application/wasm
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel.enabled: false
  tomcat:
    accesslog.enabled: false

ruko:
  analyze:    { max-chars: 4000, min-chars: 20, min-ocr-confidence: 0.6, max-body-bytes: 65536 }
  llm:        { enabled: "${LLM_ENABLED:false}", timeout: 3s, base-url: "${LLM_URL:}", api-key: "${LLM_KEY:}", model: "${LLM_MODEL:}" }
  bhashini:   { enabled: "${BHASHINI_ENABLED:true}", timeout: 3s, asr-timeout: 10s, user-id: "${BHASHINI_USER:}", api-key: "${BHASHINI_KEY:}",
                config-url: "${BHASHINI_CONFIG_URL:https://meity-auth.ulcacontrib.org/ulca/apis/v0/model/getModelsPipeline}",
                pipeline-id: "${BHASHINI_PIPELINE_ID:64392f96daac500b55c543cd}" }
  voice:      { ffmpeg: "${FFMPEG_PATH:ffmpeg}", asr-max-seconds: 60, conversion-timeout: 10s }
  links:      { allow: [siportal.sebi.gov.in, scores.sebi.gov.in, cybercrime.gov.in] }
  rate-limit: { per-ip-per-min: "${RATE_LIMIT:30}" }
  features:   { asr: false, complaint: true, s10-domain-age: false, snapshot: true }

management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    # /actuator/health/liveness and /actuator/health/readiness; readiness also needs RulesHealthIndicator up.
    probes.enabled: true
    group.readiness.include: readinessState,rules
  info.env.enabled: false

springdoc:
  paths-to-match: /api/**
  # Public on purpose: the API page is part of the submission. It documents routes only, never data.
  api-docs.enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    validator-url: none
    operations-sorter: alpha

logging:
  level:
    root: INFO
    # Tomcat parser and Spring web debug output can quote request lines, headers, and bodies.
    org.apache.coyote: WARN
    org.apache.tomcat: WARN
    org.springframework.web: WARN
